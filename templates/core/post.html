<div class="col-md-4" id="{{ post.slug }}">
  <div class="card mb-4 product-wap rounded-1">
    <div>
      <a href="{% url 'post-detail' post.slug %}"><img alt="{{ post.title }}" class="card-img rounded-0 img-thumbnail" src="{{ post.image_thumbnail.url }}" title="{{ post.description }}" /></a>
    </div>
    <div>
      <div class="container card-body">
        <div class="row">
          <div class="col">
            <a class="h3 d-inline-block text-truncate text-decoration-none me-auto text-nowrap" href="{% url 'post-detail' post.slug %}">{{ post.title }}</a>
          </div>
          <div class="col-auto pe-0">
            <div class="comment-button">
              <form action="{% url 'post-detail' post.slug %}#comment-section">
                <button class="btn btn-sm btn-primary justify-content-center me-1" type="submit">
                  <span>{{ post.number_of_comments }}</span>
                  <i class="fa fa-comment"></i>
                </button>
              </form>
            </div>
          </div>
          <div class="col-auto ps-0">
            <div class="like-button">
              <form action="{% url 'post-like' post.slug %}" method="POST">
                {% csrf_token %}
                {% if post.slug in user_likes %}
                  <button class="btn btn-sm btn-danger justify-content-center" type="submit">
                    <span>{{ post.number_of_likes }}</span>
                    <i class="fa fa-thumbs-up" title="Unlike"></i>
                  </button>
                {% else %}
                  <button class="btn btn-sm btn-primary justify-content-end" type="submit">
                    <span>{{ post.number_of_likes }}</span>
                    <i class="fa fa-thumbs-up" title="Like"></i>
                  </button>
                {% endif %}
              </form>
            </div>
          </div>
        </div>
        <div class="row text-muted">
          <div class="col">
            <div class="ms-3 d-flex">
              <h5 class="card-body-author"><i class="fa fa-user me-2"></i>{{ post.author.username }}</h5>
            </div>
          </div>
          <div class="col">
            <div class="d-flex ms-3">
                <h6>{{ post.created_at }}</h6>
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
