{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="ms-3 me-auto text-light">
    <div class="row mb-1">
      <a class="nav-link" href="{% url 'home' %}">
        <div class="row">
          <div class="col align-self-center">
            <h1 class="display-4">Photo contest</h1>
          </div>
        </div>
      </a>
    </div>
    <div class="row">
      {% if request.user.is_authenticated %}
        <a class="nav-link ms-1" href="{% url 'post-create' %}">
          <div class="col">
            <i class="fa fa-file-image-o"></i>
          </div>
          <div class="col">
            <h4 class="">Add post</h4>
          </div>
        </a>
      {% endif %}
    </div>
  </div>
  <div class="me-3 text-decoration-none color-red text-light">
    {% if not request.user.is_authenticated %}
      <a class="nav-link text-decoration-none" href="{% url 'account_login' %}">Login</a>
      <a class="nav-link text-decoration-none" href="{% url 'account_signup' %}">Sign up</a>
    {% else %}
      <a class="nav-link text-decoration-none" href="{% url 'users:profile' pk=user.pk %}">Profile</a>
      <a class="nav-link text-decoration-none" href="{% url 'account_logout' %}">Log out</a>
    {% endif %}
  </div>
</nav>
