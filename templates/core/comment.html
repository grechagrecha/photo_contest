<!-- Template for an individual comment (or a reply) -->

<div class="d-flex flex-start mt-1">
  <img class="rounded-circle shadow-1-strong me-3" src="{{ comment.user.get_avatar_url }}" alt="avatar" width="65" height="65" />
  <div class="flex-grow-1">
    <div>
      <div class="d-flex justify-content-between align-items-center">
        <p class="mb-1">
          {{ comment.user.username }}
          <span class="small">- 2 hours ago</span>
        </p>
        <!-- TODO: Maybe add 'nestedness value' to a Comment model for a cleaner solution -->
        {% if not comment.parent_comment.parent_comment %}
          <a href="{% url 'comment-reply' comment_slug=comment.slug %}"><i class="fa fa-reply me-1"></i><span class="small">Reply</span></a>
        {% endif %}
      </div>
      <p class="small mb-0">{{ comment.text }}</p>
    </div>
  </div>
</div>
