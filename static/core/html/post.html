<div class="col-md-4" id="{{ slug }}">
  <div class="card mb-4 product-wap rounded-1">
    <div data-name="image-div">
      <a href="{{ post_url }}"
        ><img
          alt="{{ title }}"
          class="card-img rounded-0 img-thumbnail"
          src="{{ image_thumbnail_url }}"
          title="{{ description }}"
      /></a>
    </div>
    <div>
      <div class="container card-body">
        <div class="row">
          <div class="col">
            <a
              class="h3 d-inline-block text-truncate text-decoration-none me-auto text-nowrap"
              href="{{ post_url }}"
              >{{ title }}</a
            >
          </div>
          <div class="col-auto pe-0">
            <div class="comment-button">
              <form action="{{ post_url }}#comment-section">
                <button
                  class="btn btn-sm btn-primary justify-content-center me-1"
                  type="submit"
                >
                  <span>{{ number_of_comments }}</span>
                  <i class="fa fa-comment"></i>
                </button>
              </form>
            </div>
          </div>
          <div class="col-auto ps-0">
            <div class="like-button">
              <form action="{{ like_url }}" method="POST">
                <input
                  type="hidden"
                  name="csrfmiddlewaretoken"
                  value="{{ csrf_token }}"
                />
                <button
                  class="btn btn-sm btn-primary justify-content-end"
                  type="submit"
                >
                  <span>{{ number_of_likes }}</span>
                  <i class="fa fa-thumbs-up" title="Like"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
        <div class="row text-muted">
          <div class="col">
            <div class="ms-3 d-flex">
              <h5 class="card-body-author">
                <i class="fa fa-user me-2"></i>{{ author_name }}
              </h5>
            </div>
          </div>
          <div class="col">
            <div class="d-flex ms-3">
              <h6>{{ created_at }}</h6>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
